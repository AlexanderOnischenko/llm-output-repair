[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-output-repair"
version = "0.1.0"
description = "Deterministic extraction and heuristic repair of structured LLM output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "pydantic>=1,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
