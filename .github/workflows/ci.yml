name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installable wheel outside the repository
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c 'from llm_output_repair import repair; assert repair("{\"x\":1,}") == {"x": 1}'
